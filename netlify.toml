[build]
  command = "npm run build"
  publish = "dist"

# Owlbear Rodeo fetches the manifest AND the icons it references cross-origin
# from its own domain, so every one of them needs CORS - scoping this to the
# manifest alone is what left the action-bar icon failing to load. Everything
# here is public static content, so a blanket allow is safe.
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=0, must-revalidate"

# The extension runs inside an OBR iframe — never send X-Frame-Options or a
# restrictive frame-ancestors CSP here, or the popover will render blank.
